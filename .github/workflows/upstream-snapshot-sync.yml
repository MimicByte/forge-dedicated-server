name: Sync upstream snapshot

# This workflow is intentionally kept on master. Scheduled workflows run from
# the repository's default branch, then explicitly update dedicated-server.
on:
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-snapshot-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/Card-Forge/forge.git

      - name: Rebase dedicated branch onto the published snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          issue_title='Dedicated server upstream sync needs attention'
          report_issue() {
            local body="$1"
            if [ "$(gh issue list --state open --search "$issue_title in:title" --json number --jq 'length')" = 0 ]; then
              gh issue create --title "$issue_title" --body "$body"
            fi
          }

          # Fetch into a fork-specific ref. actions/checkout has already
          # fetched origin's tags, so refs/tags/daily-snapshots could be stale.
          git fetch --force --prune upstream master \
            '+refs/tags/daily-snapshots:refs/tags/upstream-daily-snapshots'
          snapshot_ref='refs/tags/upstream-daily-snapshots'
          if ! git rev-parse --verify "$snapshot_ref^{commit}" >/dev/null 2>&1; then
            report_issue "The upstream daily-snapshots tag was not available.\n\nRun: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            exit 1
          fi

          snapshot=$(git rev-parse "$snapshot_ref^{commit}")
          old_master=$(git rev-parse master)
          git fetch origin master dedicated-server
          git switch master
          if ! old_upstream=$(git merge-base "$old_master" "$snapshot"); then
            report_issue "Fork master and upstream daily-snapshots have no common ancestor. Manual review is required before synchronization.\n\nFork master: $old_master\nSnapshot: $snapshot"
            exit 1
          fi
          # master carries one or more fork-owned maintenance commits. Find
          # their common base with upstream instead of assuming master^1 is it.
          # This is the same comparison GitHub's branch UI performs.
          if [ "$old_upstream" != "$snapshot" ]; then
            git rebase --onto "$snapshot" "$old_upstream" master
          fi

          git switch dedicated-server
          if ! git rebase master; then
            git rebase --abort || true
            report_issue "The dedicated-server branch could not be rebased automatically.\n\nBase snapshot: $snapshot\n\nResolve the conflicts locally, then rerun this workflow.\n\nRun: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            exit 1
          fi

          git push --force-with-lease origin dedicated-server
          git push --force-with-lease origin master
