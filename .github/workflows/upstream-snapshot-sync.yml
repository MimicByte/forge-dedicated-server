name: Sync upstream snapshot

# This workflow is maintained on master and mirrored to dedicated-server.
# dedicated-server intentionally remains the repository's default branch, so
# GitHub evaluates its copy for scheduled runs; the job explicitly updates
# master first, then merges master into dedicated-server.
on:
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: upstream-snapshot-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/Card-Forge/forge.git

      - name: Merge the published snapshot into fork branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          issue_title='Dedicated server upstream sync needs attention'
          report_issue() {
            local body="$1"
            if [ "$(gh issue list --state open --search "$issue_title in:title" --json number --jq 'length')" = 0 ]; then
              gh issue create --title "$issue_title" --body "$body"
            fi
          }

          # Fetch into a fork-specific ref. actions/checkout has already
          # fetched origin's tags, so refs/tags/daily-snapshots could be stale.
          git fetch --force --prune upstream master \
            '+refs/tags/daily-snapshots:refs/tags/upstream-daily-snapshots'
          snapshot_ref='refs/tags/upstream-daily-snapshots'
          if ! git rev-parse --verify "$snapshot_ref^{commit}" >/dev/null 2>&1; then
            report_issue "The upstream daily-snapshots tag was not available.\n\nRun: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            exit 1
          fi

          snapshot=$(git rev-parse "$snapshot_ref^{commit}")
          git fetch origin master dedicated-server
          git switch master
          if ! git merge-base --is-ancestor "$snapshot" master; then
            if ! git merge --no-ff -m "chore: sync upstream snapshot ${snapshot:0:12}" "$snapshot"; then
              git merge --abort || true
              report_issue "Fork master could not merge the upstream daily-snapshots revision.\n\nSnapshot: $snapshot\n\nResolve the conflicts locally, then rerun this workflow.\n\nRun: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              exit 1
            fi
          fi

          git switch dedicated-server
          if ! git merge-base --is-ancestor master dedicated-server; then
            if ! git merge --no-ff -m "chore: sync dedicated server with upstream snapshot ${snapshot:0:12}" master; then
              git merge --abort || true
              report_issue "The dedicated-server branch could not merge the updated fork master.\n\nBase snapshot: $snapshot\n\nResolve the conflicts locally, then rerun this workflow.\n\nRun: $GITHUB_SERVER_URL/$GITHUB_RUN_ID"
              exit 1
            fi
          fi

          git push origin master dedicated-server
          # Pushes made with GITHUB_TOKEN do not start another workflow. Run
          # the dedicated publisher explicitly so the rolling release and
          # GHCR retention stay aligned with the synchronized branch.
          gh workflow run dedicated-ci.yml --repo "$GITHUB_REPOSITORY" --ref dedicated-server
